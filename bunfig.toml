[test]
# Runs before the whole suite when `bun test` is invoked from the repo root.
# Registers the virtual `cloudflare:workers` module (see test/setup.ts) so source
# files that import `env` at module load can be exercised across every workspace.
preload = ["./test/setup.ts"]

# ADR-035 phase 2: workspaces that have moved to Vitest. Bun resolves the `vitest` package
# but not its runner context, so anything using `vi.*` throws here. This whole block goes away
# once `vp test` owns the suite.
pathIgnorePatterns = [
	"**/apps/uptime/**",
	"**/packages/arrays/**",
	"**/packages/uuid/**",
	"**/apps/blog/**",
	"**/packages/duration/**",
	"**/packages/markdown/**",
	"**/packages/rss/**",
	"**/packages/strings/**",
	"**/packages/typeid/**",
	"**/packages/webhooks/**",
	"**/packages/xml/**",
	"**/packages/ui/**",
	"**/packages/u/**",
	"**/packages/api-client/**",
	"**/packages/get-client-ip/**",
	"**/packages/hostname/**",
	"**/packages/iife/**",
	"**/packages/kv-cache/**",
	"**/packages/location/**",
	"**/packages/lucide-remix/**",
	"**/packages/oidc-client/**",
	"**/packages/response/**",
	"**/packages/service-container/**",
	"**/packages/session-storage-kv/**",
	"**/packages/ui-router/**",
	"**/packages/validate/**",
	"**/packages/dates/**",
	"**/packages/cron/**",
	"**/packages/http/**",
	"**/packages/crypto/**",
	"**/packages/result/**",
	"**/apps/r3-auth/app/data/subject.test.ts",
	"**/apps/pkmn/**",
	"**/apps/books/**",
	"**/apps/auth-saas/**",
	"**/packages/i18n/**",
	"**/packages/seo/**",
]
