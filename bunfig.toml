[test]
# Runs before the whole suite when `bun test` is invoked from the repo root.
# Registers the virtual `cloudflare:workers` module (see test/setup.ts) so source
# files that import `env` at module load can be exercised across every workspace.
preload = ["./test/setup.ts"]

# ADR-035 phase 2: files already converted to Vitest. Bun resolves the `vitest` package but
# not its runner context, so anything using `vi.*` throws here. This list shrinks to a single
# `apps/uptime/**` entry once the app is fully converted, and disappears when `vp test` owns
# the whole suite.
pathIgnorePatterns = [
	"**/apps/uptime/app/lib/uptime-report.test.ts",
	"**/apps/uptime/app/lib/concurrency.test.ts",
	"**/apps/uptime/app/http/controllers/healthcheck-analytics-engine.test.ts",
	"**/apps/uptime/app/lib/container.test.ts",
	"**/apps/uptime/app/lib/cost-rates.test.ts",
	"**/apps/uptime/app/lib/cron-text.test.ts",
	"**/apps/uptime/app/lib/dns-record-value.test.ts",
	"**/apps/uptime/app/lib/monitor-scope.test.ts",
	"**/apps/uptime/app/lib/notify-queue.test.ts",
	"**/apps/uptime/app/lib/pricing.test.ts",
	"**/apps/uptime/app/lib/retention.test.ts",
	"**/apps/uptime/app/lib/timezones.test.ts",
	"**/apps/uptime/app/lib/trial-history.test.ts",
	"**/apps/uptime/app/lib/trial-identity.test.ts",
	"**/apps/uptime/app/http/middleware/attribution.test.ts",
	"**/apps/uptime/app/http/middleware/auth.test.ts",
	"**/apps/uptime/app/http/middleware/i18n.test.ts",
	"**/apps/uptime/app/http/middleware/require-api-key.test.ts",
	"**/apps/uptime/app/http/middleware/require-role.test.ts",
	"**/apps/uptime/app/http/middleware/require-team.test.ts",
	"**/apps/uptime/app/http/middleware/require-user.test.ts",
	"**/apps/uptime/app/http/middleware/session.test.ts",
]
