[test]
# Runs before the whole suite when `bun test` is invoked from the repo root.
# Registers the virtual `cloudflare:workers` module (see test/setup.ts) so source
# files that import `env` at module load can be exercised across every workspace.
preload = ["./test/setup.ts"]

# ADR-035 phase 2: workspaces that have moved to Vitest. Bun resolves the `vitest` package
# but not its runner context, so anything using `vi.*` throws here. This whole block goes away
# once `vp test` owns the suite.
pathIgnorePatterns = [
	"**/apps/uptime/**",
	"**/packages/arrays/**",
	"**/packages/uuid/**",
	"**/apps/blog/**",
	"**/packages/duration/**",
