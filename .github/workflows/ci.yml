name: CI

# Every job runs the script `sdxc ci` runs locally, .config/sdxc/ci.ts, so the steps live in one
# place: this file only provisions machines and expands the test matrix. A commit a contributor
# already signed off with a green local `sdxc ci` skips every job after the gate.

permissions:
  contents: read
  statuses: read

env:
  BUN_VERSION: 1.4.2

defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # `sdxc ci --push` posts the sdxc/ci status seconds after the push lands, so the gate waits a
  # minute for it. Only a status from someone with write access counts; anything else runs in full.
  gate:
    name: Signoff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      signed: ${{ steps.verify.outputs.signed }}

    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v7

      - &setup-bun
        name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Vitest runs on Node, and the runner's default Node still flags node:sqlite (behind the
      # in-memory test databases) as experimental, printing a warning from every worker.
      - &setup-node
        name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # Bun installs the dependencies; the action would otherwise cache npm's, because the
          # npm entry in the root devEngines reads as "npm is the package manager", and fail
          # over the package-lock.json this repo does not have.
          package-manager-cache: false

      # Socket Firewall proxies the registry traffic of the install below and refuses any
      # version Socket knows to be malware, which a lockfile cannot do on its own: a version
      # is often flagged days after it was published and pinned. A block surfaces as a
      # resolution failure from bun, and the firewall step logs the package and the reason.
      - &setup-socket-firewall
        name: Setup Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      # `sdxc ci` installs on its own only on a laptop; on CI this firewalled install is the one.
      - &install-dependencies
        name: Install dependencies
        run: sfw bun install --frozen-lockfile

      - name: Verify signoff
        id: verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if bun packages/kit/src/bin.ts ci verify "$SHA" --repo "$GITHUB_REPOSITORY" --wait 60s; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

  # Every step of the script but the tests: typegen, the doctor, `bun check` and the release-note
  # bodies of every commit the push or pull request adds. A pull request is checked from its
  # head, and a new branch with no `before` falls back to `main`.
  check:
    name: Check
    needs: gate
    if: needs.gate.outputs.signed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - *setup-bun
      - *setup-node
      - *setup-socket-firewall
      - *install-dependencies

      - name: Run CI without tests
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=origin/main
          fi
          SDXC_COMMIT_RANGE="$BASE..$HEAD" bun packages/kit/src/bin.ts ci --runner remote --skip Tests

  # The script's Tests matrix holds one entry per workspace with a test file, plus `root` for the
  # repo-level suites, so a new workspace gets its own job without editing this file.
  entries:
    name: List test entries
    needs: gate
    if: needs.gate.outputs.signed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      entries: ${{ steps.list.outputs.entries }}

    steps:
      - *checkout
      - *setup-bun
      - *setup-socket-firewall
      - *install-dependencies

      - name: List the Tests matrix
        id: list
        run: echo "entries=$(bun packages/kit/src/bin.ts ci list --runner remote --matrix Tests --json)" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.entry }})
    needs: entries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.entries.outputs.entries) }}

    steps:
      - *checkout
      - *setup-bun
      - *setup-node
      - *setup-socket-firewall
      - *install-dependencies

      # A `*.browser.test.ts(x)` file runs in headless Chromium through Vitest Browser Mode, so
      # only a workspace holding one installs the browser. Browser Mode runs headless, which
      # needs only Chromium's headless shell; the download is cached per Playwright version,
      # while the system libraries it links against install on every run.
      - name: Detect browser tests
        id: browser
        env:
          WORKSPACE: ${{ matrix.entry }}
        run: |
          if [ "$WORKSPACE" != root ] && [ -n "$(git ls-files -- "$WORKSPACE/*.browser.test.ts" "$WORKSPACE/*.browser.test.tsx")" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "playwright=$(jq -r .version node_modules/playwright/package.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Chromium
        if: steps.browser.outputs.needed == 'true'
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.browser.outputs.playwright }}-chromium-headless-shell

      - name: Install Chromium
        if: steps.browser.outputs.needed == 'true' && steps.chromium-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --only-shell chromium

      - name: Install Chromium system dependencies
        if: steps.browser.outputs.needed == 'true'
        run: bunx playwright install-deps chromium

      # The Workers pool loads each app's secrets from `.dev.vars`, which the script's
      # Example secrets step writes from `.env.example` before this entry's tests run.
      - name: Run tests
        env:
          ENTRY: ${{ matrix.entry }}
        run: bun packages/kit/src/bin.ts ci --runner remote --only "Example secrets" --only "Tests/$ENTRY"
