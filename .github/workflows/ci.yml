name: CI

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.2

defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v7

      - &setup-bun
        name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Vitest runs on Node, and the runner's default Node still flags node:sqlite (behind the
      # in-memory test databases) as experimental, printing a warning from every worker.
      - &setup-node
        name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # Bun installs the dependencies; the action would otherwise cache npm's, because the
          # npm entry in the root devEngines reads as "npm is the package manager", and fail
          # over the package-lock.json this repo does not have.
          package-manager-cache: false

      # Socket Firewall proxies the registry traffic of the install below and refuses any
      # version Socket knows to be malware, which a lockfile cannot do on its own: a version
      # is often flagged days after it was published and pinned. A block surfaces as a
      # resolution failure from bun, and the firewall step logs the package and the reason.
      - &setup-socket-firewall
        name: Setup Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - &install-dependencies
        name: Install dependencies
        run: sfw bun install --frozen-lockfile

      # Typegen reads each app's secrets from `.dev.vars` to type them, and the Workers test
      # pool loads them from there as the Worker's environment.
      - &example-secrets
        name: Use example secrets
        run: |
          for file in apps/*/.env.example; do
            cp "$file" "${file%/.env.example}/.dev.vars"
          done

      - name: Generate framework types
        run: bun --filter '*' cli typegen

      # Runs after typegen, which the doctor's typegen check compares the Worker types against.
      - name: Run sdxc doctor
        run: bun run doctor

      - name: Run Check
        run: bun run check

  # A local commit-msg hook is skipped by `--no-verify` and by clones that never ran
  # `bun install`, so every commit a push or pull request adds is checked again here for the
  # release-note body ADR-140 requires. A pull request is checked from its head, not from the
  # merge commit GitHub checks out, and a new branch with no `before` falls back to `main`.
  commits:
    name: Commit bodies
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - *setup-bun
      - *setup-node
      - *setup-socket-firewall
      - *install-dependencies

      - name: Check commit bodies
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=origin/main
          fi
          SDXC_COMMIT_RANGE="$BASE..$HEAD" bun packages/kit/src/bin.ts doctor --only commits

  workspaces:
    name: List test workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      workspaces: ${{ steps.list.outputs.workspaces }}

    steps:
      - *checkout

      # Every app and package holding a test file becomes one Test job, and the repo-level
      # `test/` and `scripts/` suites become the `root` job, so a new workspace is picked up
      # without editing this file.
      - name: List workspaces with tests
        id: list
        run: |
          workspaces=$(
            git ls-files -- '*.test.ts' '*.test.tsx' \
              | awk -F/ '$1 == "apps" || $1 == "packages" { print $1 "/" $2; next } { print "root" }' \
              | sort -u \
              | jq --raw-input --null-input --compact-output '[inputs]'
          )
          echo "workspaces=$workspaces" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.workspace }})
    needs: workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.workspaces.outputs.workspaces) }}

    steps:
      - *checkout
      - *setup-bun
      - *setup-node
      - *setup-socket-firewall
      - *install-dependencies
      - *example-secrets

      # A `*.browser.test.ts(x)` file runs in headless Chromium through Vitest Browser Mode, so
      # only a workspace holding one installs the browser. Browser Mode runs headless, which
      # needs only Chromium's headless shell; the download is cached per Playwright version,
      # while the system libraries it links against install on every run.
      - name: Detect browser tests
        id: browser
        env:
          WORKSPACE: ${{ matrix.workspace }}
        run: |
          if [ "$WORKSPACE" != root ] && [ -n "$(git ls-files -- "$WORKSPACE/*.browser.test.ts" "$WORKSPACE/*.browser.test.tsx")" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "playwright=$(jq -r .version node_modules/playwright/package.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Chromium
        if: steps.browser.outputs.needed == 'true'
        id: chromium-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.browser.outputs.playwright }}-chromium-headless-shell

      - name: Install Chromium
        if: steps.browser.outputs.needed == 'true' && steps.chromium-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --only-shell chromium

      - name: Install Chromium system dependencies
        if: steps.browser.outputs.needed == 'true'
        run: bunx playwright install-deps chromium

      # Vitest matches a relative filter as a substring of each project's own paths, so
      # `packages/u` would also run `ui`, `uuid` and `user-agent`. An absolute path ending in
      # a slash matches as a prefix instead: exactly this workspace, across every project that
      # collects from it (an app's threads project and its Workers project alike).
      - name: Run tests
        env:
          WORKSPACE: ${{ matrix.workspace }}
        run: |
          if [ "$WORKSPACE" = root ]; then
            bun run test --project root
          else
            bun run test "$PWD/$WORKSPACE/"
          fi
