name: CI

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "content/**"
      - "docs/**"
      - "*.md"
  push:
    branches:
      - main
    paths-ignore:
      - "content/**"
      - "docs/**"
      - "*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            command: bun format
            typegen: false
          - name: Lint
            command: bun lint
            typegen: false
          - name: Typecheck
            command: bun typecheck
            typegen: true
          - name: Test
            command: bun run test
            typegen: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate framework types
        if: matrix.typegen
        run: |
          for file in apps/*/.env.example; do
            cp "$file" "${file%/.env.example}/.dev.vars"
          done

          bun --filter '*' rr:typegen
          bun --filter '*' cf:typegen

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
