name: Deploy app

# Every Worker app ships through `sdxc deploy`: build, then the app's own `db migrate --remote`
# and `deploy`. On demand, pick an app (or `all`) from Actions → Deploy app → Run workflow. On
# each published package release, the same workflow redeploys only sdxc-site — the docs are
# built from the packages themselves, so they stay current with what just shipped. Apps without
# a D1 database pass `--skip migrate` so the plan never looks for a migrate command that is
# not there. Choosing `all` expands to one matrix job per deployable app.

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.2

defaults:
  run:
    shell: bash

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      app:
        description: App to deploy (`all` runs every deployable app in parallel)
        type: choice
        required: true
        options:
          - blog
          - books
          - r3-auth
          - sdxc-api
          - sdxc-site
          - uptime
          - all
      dry_run:
        description: Build and print the deploy plan without migrating or uploading
        type: boolean
        default: false

jobs:
  # Secrets are unreadable in a job-level `if:`, so this job reads them into a step and
  # reports whether the deploy can run. A fork or an unconfigured repository sees a skipped
  # deploy and a notice naming what is missing, and the run stays green.
  secrets:
    name: Check secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
      d1: ${{ steps.check.outputs.d1 }}
      secrets_store: ${{ steps.check.outputs.secrets_store }}

    steps:
      - name: Check Cloudflare secrets
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=(CLOUDFLARE_API_TOKEN)
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::notice::Skipping deploy: missing secret(s) ${missing[*]}"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "d1=false" >> "$GITHUB_OUTPUT"
            echo "secrets_store=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # blog, uptime and r3-auth call D1 before upload. A token that can deploy Workers
          # but not list D1 fails those apps at `db migrate --remote --pending` with only
          # "exited with 1"; this probe names the missing Account → D1 → Edit grant.
          d1=$(curl -sS -o /tmp/d1.json -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")
          if [ "$d1" = "200" ] && jq -e '.success == true' /tmp/d1.json >/dev/null; then
            echo "d1=true" >> "$GITHUB_OUTPUT"
          else
            echo "d1=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN cannot list D1 databases (HTTP $d1). Grant Account → D1 → Edit on the token \"GitHub Actions Monorepo Deploy\" at https://dash.cloudflare.com/profile/api-tokens"
            jq -c '{success,errors}' /tmp/d1.json || true
          fi
          # Binding a Secrets Store secret takes Secrets Store Edit on the token and a secret
          # scoped to `workers`; without them Cloudflare refuses the new version with error
          # 10021 after the build and `db migrate --remote`. Reading the store is the part a
          # side-effect-free probe can check, so a missing grant fails before either step.
          store=$(curl -sS -o /tmp/secrets-store.json -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/secrets_store/stores")
          if [ "$store" = "200" ] && jq -e '.success == true' /tmp/secrets-store.json >/dev/null; then
            echo "secrets_store=true" >> "$GITHUB_OUTPUT"
          else
            echo "secrets_store=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN cannot read the Secrets Store (HTTP $store). Grant Account → Secrets Store → Edit on the token \"GitHub Actions Monorepo Deploy\" at https://dash.cloudflare.com/profile/api-tokens"
            jq -c '{success,errors}' /tmp/secrets-store.json || true
            # Names the token CI actually holds, so a grant made on another token, or a new
            # token never copied into the repository secret, shows up as a mismatched id.
            curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/user/tokens/verify" |
              jq -r '"::notice::CLOUDFLARE_API_TOKEN is token id \(.result.id // "unknown") (\(.result.status // "unverified")); compare it with the id shown for \"GitHub Actions Monorepo Deploy\" at https://dash.cloudflare.com/profile/api-tokens"' || true
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

  # A release always ships sdxc-site; a manual run ships the chosen app, or every
  # workflow_dispatch option except `all` when that choice is selected. Reading the
  # options from this file keeps `all` aligned with what `app register --deploy` appends.
  apps:
    name: Resolve apps
    needs: secrets
    if: needs.secrets.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve deploy matrix
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED: ${{ inputs.app }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            matrix='["sdxc-site"]'
          elif [ "$SELECTED" = "all" ]; then
            matrix=$(
              awk '
                /^[[:space:]]+options:/ { in_opts = 1; next }
                in_opts && /^[[:space:]]+- / {
                  app = $2
                  if (app != "all") {
                    if (n++) printf ","
                    printf "\"%s\"", app
                  }
                  next
                }
                in_opts { exit }
              ' .github/workflows/deploy-apps.yml
            )
            matrix="[$matrix]"
          else
            matrix=$(jq -cn --arg app "$SELECTED" '[$app]')
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Deploying: $matrix"

  deploy:
    name: Deploy ${{ matrix.app }}
    needs: [secrets, apps]
    if: needs.secrets.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A deploy is never cancelled part-way: the previous one for the same app finishes and
    # this waits, so the worker is never replaced by a run that was interrupted mid-upload.
    # Keyed per app so an `all` run serializes with a single-app deploy of the same name.
    concurrency:
      group: deploy-app-${{ matrix.app }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.apps.outputs.matrix) }}
    env:
      APP: ${{ matrix.app }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Socket Firewall proxies the registry traffic of the install below and refuses any
      # version Socket knows to be malware, which a lockfile cannot do on its own: a version
      # is often flagged days after it was published and pinned. A block surfaces as a
      # resolution failure from bun, and the firewall step logs the package and the reason.
      - name: Setup Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      # Install from the monorepo root so workspace packages resolve; every later step runs
      # inside the selected app via `defaults.run.working-directory`.
      - name: Install dependencies
        working-directory: .
        run: sfw bun install --frozen-lockfile

      # Typegen reads secrets from `.dev.vars` to type them. Production values stay in
      # Cloudflare; the example file only supplies names so the generated `Env` matches.
      # When `.env.example` declares `CLOUDFLARE_ACCOUNT_ID=` (a Worker analytics secret),
      # fill it from the job secret so the empty placeholder cannot blank wrangler auth.
      - name: Use example secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cp .env.example .dev.vars
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && grep -q '^CLOUDFLARE_ACCOUNT_ID=' .dev.vars; then
            sed -i "s|^CLOUDFLARE_ACCOUNT_ID=.*|CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID|" .dev.vars
          fi

      # blog / uptime / r3-auth need D1 before migrate; fail here with the dashboard fix
      # instead of building for a minute and dying on "exited with 1". books, sdxc-api
      # and sdxc-site have no D1 and skip migrate below.
      - name: Require D1 for apps that migrate
        if: ${{ matrix.app != 'books' && matrix.app != 'sdxc-api' && matrix.app != 'sdxc-site' }}
        env:
          D1_OK: ${{ needs.secrets.outputs.d1 }}
        run: |
          if [ "$D1_OK" != "true" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN cannot list D1 databases, so ${{ matrix.app }} cannot run db migrate --remote. Grant Account → D1 → Edit on the token \"GitHub Actions Monorepo Deploy\" at https://dash.cloudflare.com/profile/api-tokens then re-run."
            exit 1
          fi

      # An app binding a Secrets Store secret fails the upload with error 10021 unless the
      # token holds Secrets Store Edit; a token that cannot even read the store stops here,
      # before `db migrate --remote` runs.
      - name: Require Secrets Store for apps that bind it
        env:
          STORE_OK: ${{ needs.secrets.outputs.secrets_store }}
        run: |
          configs=$(ls wrangler.jsonc cloudflare.config.ts 2>/dev/null || true)
          if [ -z "$configs" ] || ! grep -q -E 'secrets_store_secrets|secretsStoreSecret' $configs; then
            exit 0
          fi
          if [ "$STORE_OK" != "true" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN cannot read the Secrets Store, so $APP cannot bind its Secrets Store secrets. Grant Account → Secrets Store → Edit on the token \"GitHub Actions Monorepo Deploy\" at https://dash.cloudflare.com/profile/api-tokens then re-run."
            exit 1
          fi

      # The generated Worker `Env` is read by the app's own source, so it is written before
      # the build rather than taken from the repository. The monorepo's `@sdxc/kit` binary is
      # used so every app — including ones that do not list the package themselves — runs the
      # same `sdxc` the workspace ships.
      - name: Generate framework types
        run: bun "$GITHUB_WORKSPACE/packages/kit/src/bin.ts" run typegen

      # `sdxc deploy` builds, then runs the app's `db migrate --remote` and `deploy`. Apps
      # without a database (books, sdxc-api, sdxc-site) skip migrate. `--yes` stands in for
      # the interactive confirmation a CI run cannot answer; `--dry-run` stops after the plan.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          flags=(--yes)
          case "$APP" in
            books|sdxc-api|sdxc-site) flags+=(--skip migrate) ;;
          esac
          if [ "$DRY_RUN" = "true" ]; then
            flags+=(--dry-run)
          fi
          bun "$GITHUB_WORKSPACE/packages/kit/src/bin.ts" deploy "${flags[@]}"
