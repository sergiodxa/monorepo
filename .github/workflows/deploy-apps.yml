name: Deploy app

# Every Worker app ships through `sdxc deploy`: build, then the app's own `db migrate --remote`
# and `deploy`. On demand, pick an app from Actions → Deploy app → Run workflow. On each
# published package release, the same workflow redeploys only sdxc-site — the docs are built
# from the packages themselves, so they stay current with what just shipped. Apps without a
# D1 database pass `--skip migrate` so the plan never looks for a migrate command that is
# not there.

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.2
  # A manual run uses the chosen app; a release event has no inputs, so the docs site deploys.
  APP: ${{ inputs.app || 'sdxc-site' }}

defaults:
  run:
    shell: bash

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      app:
        description: App to deploy
        type: choice
        required: true
        options:
          - blog
          - books
          - r3-auth
          - sdxc-site
          - uptime
      dry_run:
        description: Build and print the deploy plan without migrating or uploading
        type: boolean
        default: false

# A deploy is never cancelled part-way: the previous one for the same app finishes and this
# waits, so the worker is never replaced by a run that was interrupted mid-upload.
concurrency:
  group: deploy-app-${{ inputs.app || 'sdxc-site' }}
  cancel-in-progress: false

jobs:
  # Secrets are unreadable in a job-level `if:`, so this job reads them into a step and
  # reports whether the deploy can run. A fork or an unconfigured repository sees a skipped
  # deploy and a notice naming what is missing, and the run stays green.
  secrets:
    name: Check secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}

    steps:
      - name: Check Cloudflare secrets
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=(CLOUDFLARE_API_TOKEN)
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          if [ ${#missing[@]} -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping the ${{ env.APP }} deploy: missing secret(s) ${missing[*]}"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy ${{ env.APP }}
    needs: secrets
    if: needs.secrets.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/${{ env.APP }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Socket Firewall proxies the registry traffic of the install below and refuses any
      # version Socket knows to be malware, which a lockfile cannot do on its own: a version
      # is often flagged days after it was published and pinned. A block surfaces as a
      # resolution failure from bun, and the firewall step logs the package and the reason.
      - name: Setup Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      # Install from the monorepo root so workspace packages resolve; every later step runs
      # inside the selected app via `defaults.run.working-directory`.
      - name: Install dependencies
        working-directory: .
        run: sfw bun install --frozen-lockfile

      # Typegen reads secrets from `.dev.vars` to type them. Production values stay in
      # Cloudflare; the example file only supplies names so the generated `Env` matches.
      - name: Use example secrets
        run: cp .env.example .dev.vars

      # The generated Worker `Env` is read by the app's own source, so it is written before
      # the build rather than taken from the repository. The monorepo's `@sdxc/kit` binary is
      # used so every app — including ones that do not list the package themselves — runs the
      # same `sdxc` the workspace ships.
      - name: Generate framework types
        run: bun "$GITHUB_WORKSPACE/packages/kit/src/bin.ts" run typegen

      # `sdxc deploy` builds, then runs the app's `db migrate --remote` and `deploy`. Apps
      # without a database (books, sdxc-site) skip migrate. `--yes` stands in for the
      # interactive confirmation a CI run cannot answer; `--dry-run` stops after the plan.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          flags=(--yes)
          case "$APP" in
            books|sdxc-site) flags+=(--skip migrate) ;;
          esac
          if [ "$DRY_RUN" = "true" ]; then
            flags+=(--dry-run)
          fi
          bun "$GITHUB_WORKSPACE/packages/kit/src/bin.ts" deploy "${flags[@]}"
