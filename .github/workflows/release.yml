name: Release

# One dated release per day: the commits since the previous release decide which public
# packages changed, every dependent of a changed package republishes with a new exact pin,
# and the run ends with a `v<version>` tag plus a GitHub Release whose notes are those
# commits. Authentication is npm trusted publishing (OIDC), so the job holds no npm token
# and a package's first version has to be bootstrapped from a developer machine.

permissions:
  contents: write
  id-token: write

env:
  BUN_VERSION: 1.4.0

defaults:
  run:
    shell: bash

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm and create the release (unchecked = dry run)"
        type: boolean
        default: false
      force:
        description: "Treat every public package as changed"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # Bun installs the dependencies; the action would otherwise cache npm's, because the
          # npm entry in the root devEngines reads as "npm is the package manager", and fail
          # over the package-lock.json this repo does not have.
          package-manager-cache: false

      # Socket Firewall proxies the registry traffic of the install below and refuses any
      # version Socket knows to be malware, which a lockfile cannot do on its own: a version
      # is often flagged days after it was published and pinned. A block surfaces as a
      # resolution failure from bun, and the firewall step logs the package and the reason.
      - name: Setup Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Install dependencies
        run: sfw bun install --frozen-lockfile

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.publish }}" == "true" ]]; then
            flags+=(--publish)
          fi
          if [[ "${{ inputs.force }}" == "true" ]]; then
            flags+=(--force)
          fi
          bun run release "${flags[@]}"
