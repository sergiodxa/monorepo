name: Release

# One dated release per day: the commits since the previous release decide which public
# packages changed, every dependent of a changed package republishes with a new exact pin,
# and the run ends with a `v<version>` tag plus a GitHub Release whose notes are those
# commits. Authentication is npm trusted publishing (OIDC), so the job holds no npm token
# and a package's first version has to be bootstrapped from a developer machine.

permissions:
  contents: write
  id-token: write

env:
  BUN_VERSION: 1.4.0

defaults:
  run:
    shell: bash

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm and create the release (unchecked = dry run)"
        type: boolean
        default: false
      force:
        description: "Treat every public package as changed"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.publish }}" == "true" ]]; then
            flags+=(--publish)
          fi
          if [[ "${{ inputs.force }}" == "true" ]]; then
            flags+=(--force)
          fi
          bun run release "${flags[@]}"
